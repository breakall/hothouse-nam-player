<use href="#toggle" x="212" y="520"/>
<text x="212" y="574" font-size="18" font-weight="600" letter-spacing="1">REVERB</text>
<use href="#toggle" x="380" y="520"/>
<text x="380" y="574" font-size="18" font-weight="600" letter-spacing="1">CABINET</text>
<use href="#toggle" x="548" y="520"/>
<text x="548" y="574" font-size="18" font-weight="600" letter-spacing="1">CAPTURE</text>

  <rect x="139" y="621" width="482" height="70" rx="2" fill="#272b26"/>
  <text x="380" y="670" fill="#f0efe3" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="47" font-weight="900" letter-spacing="3">HOTHOUSE</text>

<circle cx="232" cy="724" r="7" fill="#5f6959" stroke="#8b9383" stroke-width="2"/>
<use href="#foot" x="232" y="802"/>
<text x="232" y="879" font-size="20" font-weight="600" letter-spacing="1.5">BYPASS</text>
