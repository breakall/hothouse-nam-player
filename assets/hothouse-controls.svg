<line x1="-36.00" y1="0.00" x2="-41.00" y2="0.00" stroke="#494b4a" stroke-width="3"/>
<line x1="-33.26" y1="-13.78" x2="-37.88" y2="-15.69" stroke="#494b4a" stroke-width="3"/>
<line x1="-25.46" y1="-25.46" x2="-28.99" y2="-28.99" stroke="#494b4a" stroke-width="3"/>
<line x1="-13.78" y1="-33.26" x2="-15.69" y2="-37.88" stroke="#494b4a" stroke-width="3"/>
<line x1="-0.00" y1="-36.00" x2="-0.00" y2="-41.00" stroke="#494b4a" stroke-width="3"/>
<line x1="13.78" y1="-33.26" x2="15.69" y2="-37.88" stroke="#494b4a" stroke-width="3"/>
<line x1="25.46" y1="-25.46" x2="28.99" y2="-28.99" stroke="#494b4a" stroke-width="3"/>
<line x1="33.26" y1="-13.78" x2="37.88" y2="-15.69" stroke="#494b4a" stroke-width="3"/>
<circle r="34" fill="#252728"/>
    <path d="M0 -32V-15" stroke="#f8f7ed" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g id="toggle">
    <path d="M-21 -12L0 -24L21 -12V12L0 24L-21 12Z" fill="url(#metal)" stroke="#737770" stroke-width="2"/>
    <circle r="15" fill="#666b66" stroke="#f5f4e9" stroke-width="3"/>
    <path d="M0 3V-24" stroke="#3f4542" stroke-width="12" stroke-linecap="round"/>
    <path d="M-2 2V-24" stroke="#d7dbd4" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g id="foot">
    <path d="M-40 -23L0 -46L40 -23V23L0 46L-40 23Z" fill="url(#metal)" stroke="#7e827b" stroke-width="2"/>
    <circle r="34" fill="#8c918a" stroke="#f4f4ec" stroke-width="3"/>
    <circle cy="-5" r="28" fill="url(#metal)" stroke="#626863" stroke-width="2"/>
    <path d="M-19 -23A28 28 0 0 1 19 -23" fill="none" stroke="#fff" stroke-width="2"/>
  </g>
</defs>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#242923">
