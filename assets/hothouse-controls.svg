<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title desc">
<title id="title">Hothouse NAM Player controls</title>
<desc id="desc">Cream Hothouse pedal with six black knobs: input, reverb mix, level, bass, middle, treble. Three toggles: reverb, cabinet, capture. Two metal footswitches: bypass and preset.</desc>
<defs>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#faf9f5"/><stop offset=".5" stop-color="#b5b6b3"/><stop offset="1" stop-color="#ecece6"/>
  </linearGradient>
  <g id="knob">
    <circle r="47" fill="#b7b6a9"/>
    <circle r="43" fill="#191b1c"/>

<line x1="36.00" y1="0.00" x2="41.00" y2="0.00" stroke="#494b4a" stroke-width="3"/>
<line x1="33.26" y1="13.78" x2="37.88" y2="15.69" stroke="#494b4a" stroke-width="3"/>
<line x1="25.46" y1="25.46" x2="28.99" y2="28.99" stroke="#494b4a" stroke-width="3"/>
<line x1="13.78" y1="33.26" x2="15.69" y2="37.88" stroke="#494b4a" stroke-width="3"/>
